name: persephone-robomp

services:
  robomp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUN_VERSION: ${BUN_VERSION:-1.3.14}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        OMP_VERSION: ${OMP_VERSION:?Set OMP_VERSION in .env}
        OMP_COMMIT: ${OMP_COMMIT:?Set OMP_COMMIT in .env}
    image: persephone/robomp:${OMP_VERSION}
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      ROBOMP_GH_PROXY_URL: http://gh-proxy:8081
      ROBOMP_GH_PROXY_HMAC_KEY: ${ROBOMP_GH_PROXY_HMAC_KEY:?Set ROBOMP_GH_PROXY_HMAC_KEY in .env}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET in .env}
      ROBOMP_BOT_LOGIN: ${ROBOMP_BOT_LOGIN:?Set ROBOMP_BOT_LOGIN in .env}
      ROBOMP_GIT_AUTHOR_NAME: ${ROBOMP_GIT_AUTHOR_NAME:-Persephone}
      ROBOMP_GIT_AUTHOR_EMAIL: ${ROBOMP_GIT_AUTHOR_EMAIL:?Set ROBOMP_GIT_AUTHOR_EMAIL in .env}
      ROBOMP_REPO_ALLOWLIST: ${ROBOMP_REPO_ALLOWLIST:?Set ROBOMP_REPO_ALLOWLIST in .env}
      ROBOMP_MAINTAINER_LOGINS: ${ROBOMP_MAINTAINER_LOGINS:-}
      ROBOMP_REVIEWER_BOTS: ${ROBOMP_REVIEWER_BOTS:-}
      ROBOMP_PR_REVIEW_ENABLED: ${ROBOMP_PR_REVIEW_ENABLED:-true}
      ROBOMP_MODEL: ${ROBOMP_MODEL:?Set ROBOMP_MODEL in .env}
      ROBOMP_PROVIDER: ${ROBOMP_PROVIDER:-}
      ROBOMP_THINKING: ${ROBOMP_THINKING:-high}
      ROBOMP_MAX_CONCURRENCY: ${ROBOMP_MAX_CONCURRENCY:-2}
      ROBOMP_TASK_TIMEOUT_SECONDS: ${ROBOMP_TASK_TIMEOUT_SECONDS:-3600}
      ROBOMP_TASK_TIMEOUT_HARD_GRACE_SECONDS: ${ROBOMP_TASK_TIMEOUT_HARD_GRACE_SECONDS:-60}
      ROBOMP_REQUEST_TIMEOUT_SECONDS: ${ROBOMP_REQUEST_TIMEOUT_SECONDS:-120}
      ROBOMP_EVENT_MAX_RETRIES: ${ROBOMP_EVENT_MAX_RETRIES:-3}
      ROBOMP_EVENT_RETRY_DELAYS_SECONDS: ${ROBOMP_EVENT_RETRY_DELAYS_SECONDS:-30,120,600}
      ROBOMP_TASK_COMPLETION_MAX_REMINDERS: ${ROBOMP_TASK_COMPLETION_MAX_REMINDERS:-2}
      ROBOMP_SHUTDOWN_DRAIN_TIMEOUT_SECONDS: ${ROBOMP_SHUTDOWN_DRAIN_TIMEOUT_SECONDS:-25}
      ROBOMP_SHUTDOWN_KILL_TIMEOUT_SECONDS: ${ROBOMP_SHUTDOWN_KILL_TIMEOUT_SECONDS:-5}
      ROBOMP_RATE_LIMIT_WINDOW_SECONDS: ${ROBOMP_RATE_LIMIT_WINDOW_SECONDS:-3600}
      ROBOMP_RATE_LIMIT_DEFAULT: ${ROBOMP_RATE_LIMIT_DEFAULT:-0}
      ROBOMP_RATE_LIMIT_CONTRIBUTOR: ${ROBOMP_RATE_LIMIT_CONTRIBUTOR:-0}
      ROBOMP_RATE_LIMIT_UNLIMITED: ${ROBOMP_RATE_LIMIT_UNLIMITED:-}
      ROBOMP_QUESTION_AUTOCLOSE_ENABLED: ${ROBOMP_QUESTION_AUTOCLOSE_ENABLED:-false}
      ROBOMP_QUESTION_AUTOCLOSE_HOURS: ${ROBOMP_QUESTION_AUTOCLOSE_HOURS:-4}
      ROBOMP_QUESTION_AUTOCLOSE_SCAN_SECONDS: ${ROBOMP_QUESTION_AUTOCLOSE_SCAN_SECONDS:-60}
      ROBOMP_ISSUE_INDEX_SYNC_SECONDS: ${ROBOMP_ISSUE_INDEX_SYNC_SECONDS:-900}
      ROBOMP_RELEASE_SENTINEL_ENABLED: ${ROBOMP_RELEASE_SENTINEL_ENABLED:-false}
      ROBOMP_RELEASE_COMMIT_PREFIX: "${ROBOMP_RELEASE_COMMIT_PREFIX:-chore: bump version to }"
      ROBOMP_RELEASE_MAX_ROUNDS: ${ROBOMP_RELEASE_MAX_ROUNDS:-5}
      ROBOMP_RELEASE_TASK_TIMEOUT_SECONDS: ${ROBOMP_RELEASE_TASK_TIMEOUT_SECONDS:-3600}
      ROBOMP_RELEASE_MODEL: ${ROBOMP_RELEASE_MODEL:-}
      ROBOMP_REPLAY_TOKEN: ${ROBOMP_REPLAY_TOKEN:?Set ROBOMP_REPLAY_TOKEN in .env}
      ROBOMP_RECLAIM_WORKSPACE_CACHES: ${ROBOMP_RECLAIM_WORKSPACE_CACHES:-true}
      ROBOMP_NATIVES_CACHE_ENABLED: ${ROBOMP_NATIVES_CACHE_ENABLED:-true}
      ROBOMP_NATIVES_CACHE_ROOT: /data/cache/pi-natives
      ROBOMP_NATIVES_CACHE_MAX_ENTRIES_PER_REPO: ${ROBOMP_NATIVES_CACHE_MAX_ENTRIES_PER_REPO:-8}
      ROBOMP_NATIVES_CACHE_MAX_BYTES: ${ROBOMP_NATIVES_CACHE_MAX_BYTES:-4294967296}
      ROBOMP_NATIVES_CACHE_GC_INTERVAL_SECONDS: ${ROBOMP_NATIVES_CACHE_GC_INTERVAL_SECONDS:-3600}
      ROBOMP_OMP_COMMAND: omp
      ROBOMP_WORKSPACE_ROOT: /data/workspaces
      ROBOMP_SQLITE_PATH: /data/robomp.sqlite
      ROBOMP_LOG_DIR: /data/logs
      ROBOMP_BIND_HOST: 0.0.0.0
      ROBOMP_BIND_PORT: 8080
      HOME: /srv/agent-home
      OTEL_SDK_DISABLED: "true"
      DO_NOT_TRACK: "1"
    depends_on:
      gh-proxy:
        condition: service_healthy
    extra_hosts:
      - "llm-gateway.internal:host-gateway"
    networks:
      - model_and_webhook
      - github_proxy
    volumes:
      - robomp_data:/data
      - ${HOME}/.omp/agent/models.container.yml:/srv/agent-home-stage/.omp/agent/models.yml:ro
      - ./AGENTS.md:/srv/agent-home-stage/.agent/AGENTS.md:ro
    ports:
      - "${ROBOMP_PUBLIC_HOST:-127.0.0.1}:${ROBOMP_PUBLIC_PORT:-6543}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  gh-proxy:
    image: persephone/robomp:${OMP_VERSION}
    restart: unless-stopped
    command: ["python", "-m", "robomp.proxy", "serve"]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in .env}
      ROBOMP_GH_PROXY_HMAC_KEY: ${ROBOMP_GH_PROXY_HMAC_KEY:?Set ROBOMP_GH_PROXY_HMAC_KEY in .env}
      ROBOMP_BOT_LOGIN: ${ROBOMP_BOT_LOGIN:?Set ROBOMP_BOT_LOGIN in .env}
      ROBOMP_WORKSPACE_ROOT: /data/workspaces
      ROBOMP_GH_PROXY_BIND_HOST: 0.0.0.0
      ROBOMP_GH_PROXY_BIND_PORT: 8081
      ROBOMP_GH_PROXY_MAX_BODY_BYTES: ${ROBOMP_GH_PROXY_MAX_BODY_BYTES:-1048576}
      ROBOMP_GH_PROXY_GIT_TIMEOUT_SECONDS: ${ROBOMP_GH_PROXY_GIT_TIMEOUT_SECONDS:-120}
      OTEL_SDK_DISABLED: "true"
      DO_NOT_TRACK: "1"
    networks:
      - model_and_webhook
      - github_proxy
    volumes:
      - robomp_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  model_and_webhook: {}
  github_proxy:
    internal: true

volumes:
  robomp_data: {}
